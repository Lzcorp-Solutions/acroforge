name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: rspec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.1', '3.3']
    env:
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # 2.4.22 is the last bundler that supports Ruby 2.7 and still
          # works on 3.1 / 3.3. Lets one version drive the whole matrix.
          bundler: 2.4.22
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    name: standardrb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec standardrb
